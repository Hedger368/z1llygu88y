name: Deploy latest bot

on:
  push:
    tags:
      - latest
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment while it is switching releases or rolling back.
concurrency:
  group: z1llygu88y-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: [self-hosted, linux, python-deploy]
    steps:
      # Resolve the CURRENT latest tag, including for manual runs and queued jobs.
      - name: Check out latest
        uses: actions/checkout@v7
        with:
          ref: refs/tags/latest
          persist-credentials: false

      - name: Prepare release and restart bot
        shell: bash
        run: bash deploy/deploy.sh
